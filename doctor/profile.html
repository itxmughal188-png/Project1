<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Doctor Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <h1>🏥 City Care Hospital</h1>
            <ul class="nav-links">
                <li><a href="dashboard.html">Home</a></li>
                <li><a href="appointments.html">Appointments</a></li>
                <li><a href="medical_records.html">Medical Records</a></li>
                <li><a href="availability.html">Availability</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="logout.html">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="form-container">
        <h2>Edit Profile</h2>
        
        
        
        
        
        <form method="POST" action="">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" value="" required>
            </div>
            <div class="form-group">
                <label>Email (Cannot be changed)</label>
                <input type="email" value="" disabled>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" value="" required>
            </div>
            <div class="form-group">
                <label>Specialization</label>
                <input type="text" name="specialization" value="" required>
            </div>
            <div class="form-group">
                <label>Experience (Years)</label>
                <input type="number" name="experience" value="" required>
            </div>
            <div class="form-group">
                <label>Consultation Fee (Rs.)</label>
                <input type="number" step="0.01" name="fee" value="" required>
            </div>
            <button type="submit" class="btn-submit">Update Profile</button>
        </form>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 City Care Hospital. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
