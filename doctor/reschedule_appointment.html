<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reschedule Appointment - Doctor Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1>City Care Hospital</h1>
            <ul class="nav-links">
                <li><a href="dashboard.html">Home</a></li>
                <li><a href="appointments.html">Appointments</a></li>
                <li><a href="medical_records.html">Medical Records</a></li>
                <li><a href="availability.html">Availability</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="logout.html">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="form-container">
        <h2>Reschedule Appointment</h2>
        <p><strong>Patient:</strong> </p>
        <p><strong>Current Date:</strong> </p>
        <p><strong>Current Time:</strong> </p>
        
        
        
        
        
        <form method="POST" action="">
            <div class="form-group">
                <label>New Date</label>
                <input type="date" name="appointment_date" value="" required>
            </div>
            <div class="form-group">
                <label>New Time</label>
                <input type="time" name="appointment_time" value="" required>
            </div>
            <button type="submit" class="btn-submit">Reschedule</button>
        </form>
        
        <div class="login-link">
            <p><a href="appointments.html">Back to Appointments</a></p>
        </div>
    </div>
</body>
</html>
