<!DOCTYPE html>
<html>
<head>
    <title>Add Medical Record</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <h2>Add Medical Record</h2>

    <p><strong>Patient:</strong> </p>

   

    <form method="POST">

        <div class="form-group">
            <label>Diagnosis</label>
            <textarea name="diagnosis" required></textarea>
        </div>

        <div class="form-group">
            <label>Prescription</label>
            <textarea name="prescription"></textarea>
        </div>

        <div class="form-group">
            <label>Lab Reports</label>
            <textarea name="lab_reports"></textarea>
        </div>

        <div class="form-group">
            <label>Record Date</label>
            <input type="date" name="record_date" required>
        </div>

        <button type="submit" class="btn-submit">Save Medical Record</button>
    </form>
</div>

</body>
</html>
